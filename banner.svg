<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#042f2e;#0f172a" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#042f2e;#0f172a;#1e1b4b" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <clipPath id="round"><rect width="1000" height="260" rx="22"/></clipPath>
  </defs>

  <style>
    .name { font: 700 54px 'Segoe UI', Arial, sans-serif; fill: url(#name); animation: rise 1.2s ease-out both; }
    .tag  { font: 400 22px 'Courier New', monospace; fill: #e2e8f0; opacity: 0; animation: cycle 9s infinite; }
    .t1 { animation-delay: 0s; } .t2 { animation-delay: 3s; } .t3 { animation-delay: 6s; }
    .sub  { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; animation: rise 1.6s ease-out both; }
    .orb1 { animation: float1 9s ease-in-out infinite; }
    .orb2 { animation: float2 11s ease-in-out infinite; }
    .orb3 { animation: float1 13s ease-in-out infinite reverse; }
    .dot  { fill: #2dd4bf; animation: twinkle 3s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cycle { 0% { opacity: 0; } 5% { opacity: 1; } 30% { opacity: 1; } 35% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,-25px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,30px); } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="orb1" cx="170" cy="60" r="90" fill="#2dd4bf" opacity=".35"/>
      <circle class="orb2" cx="830" cy="200" r="110" fill="#a78bfa" opacity=".35"/>
      <circle class="orb3" cx="560" cy="30" r="70" fill="#38bdf8" opacity=".25"/>
    </g>
    <circle class="dot" cx="90" cy="200" r="2.5" style="animation-delay:0s"/>
    <circle class="dot" cx="300" cy="40" r="2" style="animation-delay:.8s"/>
    <circle class="dot" cx="720" cy="60" r="2.5" style="animation-delay:1.6s"/>
    <circle class="dot" cx="910" cy="90" r="2" style="animation-delay:.4s"/>
    <circle class="dot" cx="640" cy="225" r="2" style="animation-delay:2.2s"/>
    <circle class="dot" cx="450" cy="210" r="2.5" style="animation-delay:1.2s"/>

    <text class="name" x="500" y="110" text-anchor="middle">Lakshmi Manjunath</text>
    <text class="tag t1" x="500" y="158" text-anchor="middle">&gt; Aspiring DevOps Engineer</text>
    <text class="tag t2" x="500" y="158" text-anchor="middle">&gt; Cloud &amp; AI Builder</text>
    <text class="tag t3" x="500" y="158" text-anchor="middle">&gt; Docker · Jenkins · AWS</text>
    <text class="sub" x="500" y="205" text-anchor="middle">Final-year B.E. CSE · ATME College of Engineering, Mysuru · Class of 2027</text>
  </g>
  <rect x="1" y="1" width="998" height="258" rx="21" fill="none" stroke="#334155" stroke-width="1.5"/>
</svg>
